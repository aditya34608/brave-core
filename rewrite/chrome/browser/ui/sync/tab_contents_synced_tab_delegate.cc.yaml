substitutions:
  - description: |-
      Never sync tabs in temporary containers.

      Temporary containers are local-only and must not publish their tab state
      to session sync.
    preempt_function_impl:
      function_name: TabContentsSyncedTabDelegate::ShouldSync
      code: |-
        if (IsInTemporaryContainer(web_contents())) {
          return false;
        }
